# team-bus.conf — T4.1 fleet front door (nginx)
# Peers join the bus by adding their hub to the upstream block; the bus
# surface (/bus/*) is the only thing this door exposes.
upstream frost_hub {
    server 127.0.0.1:9000;
}

server {
    listen 9001;

    location /bus/ {
        proxy_pass http://frost_hub/bus/;
        proxy_read_timeout 65s;
    }

    location / {
        return 404;
    }
}
