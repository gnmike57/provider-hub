# ============================================================================
# gx10 constellation router v2 (roadmap 3 deploy, 2026-10-22) - REPLACES the
# single-model tars-hybrid-router surface AND the 3-chain draft from
# 2026-10-21. The hub offers the SEVEN constellation chains
# (providers.CONSTELLATION_CHAINS parity; option-parity law: only grows).
#
# LiteLLM semantics note: LiteLLM expresses a chain as an entry model +
# router_settings.fallbacks cascade on error/429. The FULL chain semantics
# (RACE parallel-first-commit, CONDUCTOR decompose/fan-out, SUSTAINED
# probe/verify, REDHANDS injection, refusal diverts) live in the Windows
# provider-hub gateway - direct gx10 clients get the cascade approximation.
# Direct clients wanting REDHANDS (chain 3/7) prepend the REDHANDS system
# turn themselves or route through the Windows gateway.
#
# Ablit hops ride the 4-key pool minted by abliteration_keys.py ensure-pool
# (hub-pool-1..4, re-minted 2026-10-22) - multiple deployments under one
# model_name = LiteLLM round-robins them (per-key throughput cap workaround).
# vision_bridge stays registered (V2 large is text-only).
#
# Port note: 4001 (4000 is the llm-hub front door). Endpoints:
#   /v1/chat/completions, /v1/responses, /v1/models, /health/liveliness
# ============================================================================

model_list:
  # ---- chain 1: GLMMAX>DEEP>ABLITV2L -------------------------------------
  - model_name: GLMMAX>DEEP>ABLITV2L
    litellm_params:
      model: openai/zai-org/glm-5.3-flash
      api_key: os.environ/HIVE_SECRET_KEY
      api_base: https://api-cdn.thehive.ai/api/v3
      max_completion_tokens: 32768

  - model_name: deep-hop
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4.1-flash-1017
      api_key: os.environ/HIVE_SECRET_KEY
      api_base: https://api-cdn.thehive.ai/api/v3

  # ---- chain 2: DEEPMAX>GLM>ABLITV2L -------------------------------------
  - model_name: DEEPMAX>GLM>ABLITV2L
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4.1-flash-1017
      api_key: os.environ/HIVE_SECRET_KEY
      api_base: https://api-cdn.thehive.ai/api/v3
      max_completion_tokens: 32768

  - model_name: glm-hop
    litellm_params:
      model: openai/zai-org/glm-5.3-flash
      api_key: os.environ/HIVE_SECRET_KEY
      api_base: https://api-cdn.thehive.ai/api/v3

  # ---- chain 3: ABLITV2L>SUB-GLM/DEEP (V2 brain, dual-key) ----------------
  - model_name: ABLITV2L>SUB-GLM/DEEP
    litellm_params:
      model: openai/abliterated-model-large-v2
      api_key: os.environ/ABLIT_POOL_KEY_A
      api_base: https://api.abliteration.ai/v1
  - model_name: ABLITV2L>SUB-GLM/DEEP
    litellm_params:
      model: openai/abliterated-model-large-v2
      api_key: os.environ/ABLIT_POOL_KEY_B
      api_base: https://api.abliteration.ai/v1

  # ---- chain 4: GLMMAX>ABLIT-UNC>ABLITV2L --------------------------------
  - model_name: GLMMAX>ABLIT-UNC>ABLITV2L
    litellm_params:
      model: openai/zai-org/glm-5.3-flash
      api_key: os.environ/HIVE_SECRET_KEY
      api_base: https://api-cdn.thehive.ai/api/v3
      max_completion_tokens: 32768

  - model_name: ablit-unc-hop
    litellm_params:
      model: openai/abliterated-model-large
      api_key: os.environ/ABLIT_POOL_KEY_A
      api_base: https://api.abliteration.ai/v1

  # ---- chain 5: RACE:DEEPMAX/GLMMAX>ABLITV2L -----------------------------
  # (cascade approximation; true racing lives in the Windows gateway)
  - model_name: RACE:DEEPMAX/GLMMAX>ABLITV2L
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4.1-flash-1017
      api_key: os.environ/HIVE_SECRET_KEY
      api_base: https://api-cdn.thehive.ai/api/v3
      max_completion_tokens: 32768

  - model_name: glm-max-hop
    litellm_params:
      model: openai/zai-org/glm-5.3-flash
      api_key: os.environ/HIVE_SECRET_KEY
      api_base: https://api-cdn.thehive.ai/api/v3
      max_completion_tokens: 32768

  - model_name: glm-max-hop
    litellm_params:
      model: openai/zai-org/glm-5.3-flash
      api_key: os.environ/HIVE_SECRET_KEY
      api_base: https://api-cdn.thehive.ai/api/v3
      max_completion_tokens: 32768

  # ---- chain 6: GLMMAX-CONDUCTOR>DEEP+ABLITV2L ----------------------------
  # (cascade approximation; the decompose/fan-out conductor lives in the
  # Windows gateway)
  - model_name: GLMMAX-CONDUCTOR>DEEP+ABLITV2L
    litellm_params:
      model: openai/zai-org/glm-5.3-flash
      api_key: os.environ/HIVE_SECRET_KEY
      api_base: https://api-cdn.thehive.ai/api/v3
      max_completion_tokens: 32768

  # ---- chain 7: ABLITV2L-HELM>GLM-PROBE>DEEP-VERIFY ------------------------
  - model_name: ABLITV2L-HELM>GLM-PROBE>DEEP-VERIFY
    litellm_params:
      model: openai/abliterated-model-large-v2
      api_key: os.environ/ABLIT_POOL_KEY_A
      api_base: https://api.abliteration.ai/v1
  - model_name: ABLITV2L-HELM>GLM-PROBE>DEEP-VERIFY
    litellm_params:
      model: openai/abliterated-model-large-v2
      api_key: os.environ/ABLIT_POOL_KEY_B
      api_base: https://api.abliteration.ai/v1

  # ---- the shared ABLIT V2L terminal (4-key pool round-robin) -------------
  - model_name: ablit-v2l-terminal
    litellm_params:
      model: openai/abliterated-model-large-v2
      api_key: os.environ/ABLIT_POOL_KEY_A
      api_base: https://api.abliteration.ai/v1
  - model_name: ablit-v2l-terminal
    litellm_params:
      model: openai/abliterated-model-large-v2
      api_key: os.environ/ABLIT_POOL_KEY_B
      api_base: https://api.abliteration.ai/v1
  - model_name: ablit-v2l-terminal
    litellm_params:
      model: openai/abliterated-model-large-v2
      api_key: os.environ/ABLIT_POOL_KEY_C
      api_base: https://api.abliteration.ai/v1
  - model_name: ablit-v2l-terminal
    litellm_params:
      model: openai/abliterated-model-large-v2
      api_key: os.environ/ABLIT_POOL_KEY_D
      api_base: https://api.abliteration.ai/v1

litellm_settings:
  drop_params: true
  request_timeout: 600
  callbacks:
    - vision_bridge.proxy_handler_instance

router_settings:
  num_retries: 2
  timeout: 600
  allowed_fails: 3
  # The cascades: a chain id falls back hop-by-hop onto its chain; the
  # terminal (Ablit V2 Large) is refusal-proof, so refusal diverts are
  # handled at the Windows gateway (refusal-interception) rather than here.
  fallbacks:
    - "GLMMAX>DEEP>ABLITV2L": ["deep-hop", "ablit-v2l-terminal"]
    - "DEEPMAX>GLM>ABLITV2L": ["glm-hop", "ablit-v2l-terminal"]
    - "ABLITV2L>SUB-GLM/DEEP": ["glm-hop", "deep-hop"]
    - "GLMMAX>ABLIT-UNC>ABLITV2L": ["ablit-unc-hop", "ablit-v2l-terminal"]
    - "RACE:DEEPMAX/GLMMAX>ABLITV2L": ["glm-max-hop", "ablit-v2l-terminal"]
    - "GLMMAX-CONDUCTOR>DEEP+ABLITV2L": ["deep-hop", "ablit-v2l-terminal"]
    - "ABLITV2L-HELM>GLM-PROBE>DEEP-VERIFY": ["glm-hop", "ablit-v2l-terminal"]
    - "deep-hop": ["ablit-v2l-terminal"]
    - "glm-hop": ["ablit-v2l-terminal"]
    - "glm-max-hop": ["ablit-v2l-terminal"]
    - "ablit-unc-hop": ["ablit-v2l-terminal"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

